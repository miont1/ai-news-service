[project]
name = "aibot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "openai>=3.36.1",
    "pydantic-settings>=2.16.0",
    "selectolax>=1.0.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "telethon>=1.45.0",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

