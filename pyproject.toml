[project]
name = "aibot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "miont1", email = "a.sarain3202@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
